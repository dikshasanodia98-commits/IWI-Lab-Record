<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        .card {
            width: 250px;
            border: 2px solid black;
            padding: 20px;
            margin: 30px;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Card Title</h2>
    <p>
        This card demonstrates the CSS box model including
        margin, border, and padding.
    </p>
</div>

</body>
</html>
