<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        main {
            padding: 20px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<main>
    <h2>Main Content</h2>
    <p>This is the main content area of the webpage.</p>
</main>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
