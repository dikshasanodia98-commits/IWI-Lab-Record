<!DOCTYPE html>
<html>
<head>
    <title>Functions and Scope</title>
    <script>
        // user-defined function
        function square(x) {
            return x * x;
        }

        function scopeDemo() {
            var a = 10;   // function scope
            let b = 20;   // block scope
            const c = 30; // constant value

            document.write("Square of 4: " + square(4) + "<br>");
            document.write("var a = " + a + "<br>");
            document.write("let b = " + b + "<br>");
            document.write("const c = " + c + "<br>");
        }
    </script>
</head>
<body>

<button onclick="scopeDemo()">Show Output</button>

</body>
</html>
