<!DOCTYPE html>
<html>
<head>
    <title>Links, Images and Lists</title>
</head>
<body>

<h1>HTML Demonstration</h1>

<!-- Link -->
<p>
Visit <a href="https://www.google.com">Google</a>
</p>

<!-- Image -->
<img src="https://via.placeholder.com/200" alt="Sample Image">

<!-- Unordered List -->
<h2>Unordered List</h2>
<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<!-- Ordered List -->
<h2>Ordered List</h2>
<ol>
    <li>Open Browser</li>
    <li>Write Code</li>
    <li>Run Page</li>
</ol>

<!-- Nested List -->
<h2>Nested List</h2>
<ul>
    <li>Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>
    </li>
    <li>Backend
        <ul>
            <li>PHP</li>
            <li>Python</li>
        </ul>
    </li>
</ul>

</body>
</html>
